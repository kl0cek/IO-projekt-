<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Ticket</title>
</head>
<body>
    
</body>
</html>

<script>
    const popUp = (message) => {}


    const staticData = {
        UserID: 2,
        Paid: 0,
        Active: 1
    }

    document.addEventListener("DOMContentLoaded", async () =>
    {
        const response = await fetch("https://ioapi.azurewebsites.net/api/reservation", {
            method: "POST",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(staticData)
        })

        const data = await response.json();
        if (response.status == 200) {
            popUp(data.message);
        }
        else if (response.status == 500) {
            popUp(data.message);
        }
    })

    
</script>
